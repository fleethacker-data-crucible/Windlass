<!doctype html>
<!-- Source for the placeholder emblem PNGs: build/New-WindlassBrand.ps1 renders it with headless Edge.
     ?theme=light or ?theme=dark picks the wordmark colour; the field is dark blue in both (UNIFIED-UI 8).
     Delete this file when the detailed original emblem replaces the placeholder. -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; background: transparent; }
  svg { display: block; }
</style></head><body>
<svg id="e" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="field" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#14334a"/><stop offset="1" stop-color="#071a26"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2c48d"/><stop offset="1" stop-color="#a8844f"/>
    </linearGradient>
    <linearGradient id="drum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9ad92"/><stop offset=".45" stop-color="#f4ead6"/><stop offset="1" stop-color="#9c907a"/>
    </linearGradient>
  </defs>
  <!-- compass-point rays at 3 and 9 o'clock -->
  <g fill="url(#brass)">
    <polygon points="40,190 92,182 92,198"/><polygon points="472,190 420,182 420,198"/>
  </g>
  <!-- the field and its thin brass ring -->
  <circle cx="256" cy="190" r="160" fill="url(#field)" stroke="url(#brass)" stroke-width="6"/>
  <circle cx="256" cy="190" r="148" fill="none" stroke="#c9a66b" stroke-opacity=".35" stroke-width="1.5"/>
  <!-- engraved subject: a windlass, its drum hauling the anchor chain in link by link -->
  <g>
    <!-- bedplate and the two cheeks that carry the drum -->
    <rect x="140" y="232" width="232" height="24" rx="8" fill="url(#brass)"/>
    <g fill="#071a26" opacity=".55"><circle cx="160" cy="244" r="5"/><circle cx="352" cy="244" r="5"/></g>
    <path d="M160 232 L176 140 L204 140 L212 232 Z" fill="url(#brass)"/>
    <path d="M352 232 L336 140 L308 140 L300 232 Z" fill="url(#brass)"/>
    <!-- the drum (gypsy) between the cheeks -->
    <rect x="200" y="140" width="112" height="76" rx="14" fill="url(#drum)" stroke="#8a6b45" stroke-width="2"/>
    <g stroke="#8a6b45" stroke-width="2" opacity=".7">
      <line x1="222" y1="144" x2="222" y2="212"/><line x1="244" y1="144" x2="244" y2="212"/><line x1="268" y1="144" x2="268" y2="212"/><line x1="290" y1="144" x2="290" y2="212"/>
    </g>
    <!-- the crank handle on the near cheek -->
    <circle cx="190" cy="178" r="10" fill="url(#brass)" stroke="#8a6b45" stroke-width="2"/>
    <path d="M190 178 L150 120" stroke="url(#brass)" stroke-width="9" stroke-linecap="round"/>
    <circle cx="150" cy="120" r="9" fill="#f4ead6" stroke="#8a6b45" stroke-width="2"/>
  </g>
  <!-- the anchor chain, led off the drum and out of the circle at the lower right -->
  <g fill="none" stroke="#d9b77a" stroke-width="7">
    <ellipse cx="318" cy="232" rx="13" ry="8" transform="rotate(35 318 232)"/>
    <ellipse cx="338" cy="258" rx="8" ry="13" transform="rotate(35 338 258)"/>
    <ellipse cx="358" cy="284" rx="13" ry="8" transform="rotate(35 358 284)"/>
    <ellipse cx="378" cy="310" rx="8" ry="13" transform="rotate(35 378 310)"/>
    <ellipse cx="398" cy="336" rx="13" ry="8" transform="rotate(35 398 336)"/>
    <ellipse cx="418" cy="362" rx="8" ry="13" transform="rotate(35 418 362)"/>
  </g>
  <!-- waves below the deck -->
  <g fill="none" stroke="#c9a66b" stroke-opacity=".5" stroke-width="3" stroke-linecap="round">
    <path d="M150 292 q18 -12 36 0 t36 0 t36 0 t36 0"/>
    <path d="M176 316 q18 -12 36 0 t36 0 t36 0"/>
  </g>
  <!-- the compass star above -->
  <polygon fill="url(#brass)" points="256,52 262,70 280,72 262,76 256,94 250,76 232,72 250,70"/>
  <!-- wordmark with the compass-star divider between brass rules -->
  <text id="word" x="256" y="420" text-anchor="middle" font-family="Cambria, Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" letter-spacing="10">WINDLASS</text>
  <g fill="url(#brass)">
    <rect x="120" y="451" width="110" height="3"/><rect x="282" y="451" width="110" height="3"/>
    <polygon points="256,436 262,452 278,452.5 262,454 256,470 250,454 234,452.5 250,452"/>
  </g>
</svg>
<script>
  var t = new URLSearchParams(location.search).get('theme');
  document.getElementById('word').setAttribute('fill', t === 'dark' ? '#f4ead6' : '#132633');
</script>
</body></html>
