<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" role="img" aria-label="Windlass stress test scorecard"><title>Windlass stress test scorecard</title><style>
  :root { --bg:#fbf6ea; --fg:#132633; --dim:#5d6f7b; --grid:#e3d9c4; --ok:#3f7a1f; --warn:#a86b00; --bad:#b3261e;
          --a:#1f5f8b; --b:#8a6b45; --c:#4d7a1a; --card:#f3ead6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0c1a24; --fg:#e8dcc2; --dim:#8fa1ad; --grid:#203646; --ok:#a3d65c; --warn:#e2b04a; --bad:#ff8a80;
            --a:#7cc4f0; --b:#e2c48d; --c:#a3d65c; --card:#14334a; } }
  text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: var(--fg); }
  .dim { fill: var(--dim); } .t { font-size: 20px; font-weight: 700; } .s { font-size: 12px; } .m { font-size: 14px; }
  .big { font-size: 26px; font-weight: 700; } .grid { stroke: var(--grid); stroke-width: 1; }
</style><rect width="1000" height="410" rx="12" style="fill:var(--bg)"/><text x="24" y="40" class="t">Windlass stress test · Llama 3.3 70B on a Ryzen 9 9950X3D, CPU only</text><rect x="24" y="60" width="230" height="150" rx="10" style="fill:var(--card)"/><rect x="24" y="60" width="6" height="150" rx="3" style="fill:var(--warn)"/><text x="42" y="88" class="m" style="font-weight:600">1 · Error handling</text><text x="240" y="88" class="s" text-anchor="end" style="fill:var(--warn);font-weight:700">PASS*</text><text x="42" y="138" class="big">404 · 400</text><text x="42" y="164" class="s dim">Windlass: clean errors</text><text x="42" y="181" class="s dim">Fairlead: 503 for a too-long prompt</text><rect x="270" y="60" width="230" height="150" rx="10" style="fill:var(--card)"/><rect x="270" y="60" width="6" height="150" rx="3" style="fill:var(--ok)"/><text x="288" y="88" class="m" style="font-weight:600">2 · Cancel mid-answer</text><text x="486" y="88" class="s" text-anchor="end" style="fill:var(--ok);font-weight:700">PASS</text><text x="288" y="138" class="big">22 s</text><text x="288" y="164" class="s dim">to free the turn after</text><text x="288" y="181" class="s dim">the client hung up</text><rect x="516" y="60" width="230" height="150" rx="10" style="fill:var(--card)"/><rect x="516" y="60" width="6" height="150" rx="3" style="fill:var(--warn)"/><text x="534" y="88" class="m" style="font-weight:600">3 · Full queue</text><text x="732" y="88" class="s" text-anchor="end" style="fill:var(--warn);font-weight:700">PASS*</text><text x="534" y="138" class="big">8 queued</text><text x="534" y="164" class="s dim">10th: 503 server_busy</text><text x="534" y="181" class="s dim">via Fairlead: 502 (should be 503)</text><rect x="762" y="60" width="230" height="150" rx="10" style="fill:var(--card)"/><rect x="762" y="60" width="6" height="150" rx="3" style="fill:var(--ok)"/><text x="780" y="88" class="m" style="font-weight:600">4 · Long answer</text><text x="978" y="88" class="s" text-anchor="end" style="fill:var(--ok);font-weight:700">PASS</text><text x="780" y="138" class="big">8.4 s/tok</text><text x="780" y="164" class="s dim">300 tokens in 43 min</text><text x="780" y="181" class="s dim">well inside the 1 h limit</text><rect x="24" y="226" width="230" height="150" rx="10" style="fill:var(--card)"/><rect x="24" y="226" width="6" height="150" rx="3" style="fill:var(--ok)"/><text x="42" y="254" class="m" style="font-weight:600">5 · Long prompt</text><text x="240" y="254" class="s" text-anchor="end" style="fill:var(--ok);font-weight:700">PASS</text><text x="42" y="304" class="big">2,927 tok</text><text x="42" y="330" class="s dim">first word 60 min, correct</text><text x="42" y="347" class="s dim">via Fairlead: cut at 3,600 s</text><rect x="270" y="226" width="230" height="150" rx="10" style="fill:var(--card)"/><rect x="270" y="226" width="6" height="150" rx="3" style="fill:var(--ok)"/><text x="288" y="254" class="m" style="font-weight:600">6 · Long conversation</text><text x="486" y="254" class="s" text-anchor="end" style="fill:var(--ok);font-weight:700">PASS</text><text x="288" y="304" class="big">12 / 12</text><text x="288" y="330" class="s dim">recalls correct up to</text><text x="288" y="347" class="s dim">6,576 tokens of context</text><rect x="516" y="226" width="230" height="150" rx="10" style="fill:var(--card)"/><rect x="516" y="226" width="6" height="150" rx="3" style="fill:var(--dim)"/><text x="534" y="254" class="m" style="font-weight:600">7 · One-hour soak</text><text x="732" y="254" class="s" text-anchor="end" style="fill:var(--dim);font-weight:700">NOT RUN</text><text x="534" y="304" class="big">paused</text><text x="534" y="330" class="s dim">started, paused for the day;</text><text x="534" y="347" class="s dim">to be finished in a later run</text><rect x="762" y="226" width="230" height="150" rx="10" style="fill:var(--card)"/><rect x="762" y="226" width="6" height="150" rx="3" style="fill:var(--dim)"/><text x="780" y="254" class="m" style="font-weight:600">8 · Kill and restart</text><text x="978" y="254" class="s" text-anchor="end" style="fill:var(--dim);font-weight:700">NOT RUN</text><text x="780" y="304" class="big">—</text><text x="780" y="330" class="s dim">runs after phase 7</text><text x="24" y="390" class="s dim">PASS* = Windlass behaved correctly; the request through Fairlead exposed a Fairlead bug (see the report).</text></svg>