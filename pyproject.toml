[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "windlass"
version = "0.1.0"
description = "Run very large local models layer by layer behind an OpenAI-compatible API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
# The engine. Install torch first from https://pytorch.org for your GPU (CUDA or ROCm).
engine = [
    "torch>=2.4",
    "transformers>=4.56",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "huggingface_hub>=0.24",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
windlass = "windlass.cli:main"

[tool.setuptools.packages.find]
include = ["windlass*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
